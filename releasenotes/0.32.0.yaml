version: 0.32.0
date: 2026-10-26
highlights:
  - This release promotes the 0.31.0 pre-release to stable, unchanged.
  - The panel no longer fails with "OpenCode server failed to start" once OpenCode 2 is installed on your machine (Homebrew now ships it). The extension always runs the OpenCode build bundled with it.
  - Bundled OpenCode moves from 1.18.26 to 1.19.4.
fixed:
  - Upgrading OpenCode elsewhere could break the panel. An `opencode` on your PATH, in Homebrew, or in `~/.opencode/bin` was preferred over the bundled binary regardless of version, and OpenCode 2 replaced the server API this extension speaks — its server starts, then answers every request the panel makes with a web page, so the health check never passed. The bundled binary is now always used unless you set `lmstudioCode.opencodePath` yourself, and if that override points at OpenCode 2 the log says so instead of only reporting a failed health check.
  - A server that started but never became healthy was left running, and the panel retried every 30 seconds — so a broken binary accumulated one orphaned `opencode serve` process per retry. A failed start now stops the process it spawned.
  - Changing `lmstudioCode.opencodePath` now applies on the next server start instead of needing a window reload.
changed:
  - The bundled OpenCode server moves from 1.18.26 to 1.19.4. Most relevant here - slow local model startups get a five-minute header and stream timeout instead of failing early, Gemini and Anthropic thinking defaults are corrected, and the bundled Bun runtime picks up TLS, HTTP and fetch security fixes.
added: []
removed: []
