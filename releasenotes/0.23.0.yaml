  - Re-verified end-to-end against LM Studio 0.4.20, including gpt-oss — its reasoning stream (which LM Studio sends in a different field than other models) renders as a thinking block above the answer, the graded reasoning-effort control reaches the wire for both field styles, and /compact plus post-compaction turns behave correctly.
