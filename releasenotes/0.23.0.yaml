version: 0.23.0
date: 2026-08-12
highlights:
  - Bundled OpenCode upgraded 1.18.16 → 1.18.17 — /compact reworked for smaller local models, and transient model-server errors now stop retrying after five attempts instead of hanging the turn forever.
